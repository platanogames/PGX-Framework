name: Documentation issue
description: Report an inaccurate, unclear, stale, or broken public document.
title: "[Docs]: "
labels: [documentation, triage]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: README section or wiki URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is inaccurate, unclear, or broken.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction or evidence
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication check
      options:
        - label: This report contains no private PGX source, licensed assets, or credentials.
          required: true
