name: Framework question or proposal
description: Ask a reproducible integration question or propose a public-facing improvement.
title: "[Question]: "
labels: [question, triage]
body:
  - type: input
    id: environment
    attributes:
      label: Unreal Engine and PGX version
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and goal
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you tried
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I understand that the complete source monorepo is not yet public.
          required: true
        - label: I removed private source, logs, credentials, and licensed assets.
          required: true
